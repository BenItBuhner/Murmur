name: Probe A timeout

on:
  push:
    branches: [main]
    paths: ['.github/restore/PROBE-A']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prove run
        run: |
          git config user.name 'Bennett Buhner'
          git config user.email '136861830+BenItBuhner@users.noreply.github.com'
          git rm -q .github/restore/PROBE-A
          git commit -m 'probe-a ok: timeout-minutes works'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
