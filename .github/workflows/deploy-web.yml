name: Deploy web

# The website (apps/web) is a Cloudflare Worker on the Workers Free plan, built with OpenNext.
# A push to main that touches the site, or the backend whose generated types it imports, builds
# the Worker and deploys it with wrangler; pull requests get the build-only check in ci.yml
# (web-check bundles the Worker with `wrangler deploy --dry-run`). Nothing here needs the
# Cloudflare dashboard: the first deploy creates the Worker and provisions its KV namespace.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template, scoped to
#                          the one account (it carries the Workers Scripts and Workers KV Storage
#                          permissions the deploy and the cache namespace need)
#   CLOUDFLARE_ACCOUNT_ID  the account id (Workers & Pages overview, right-hand column)
#   CLERK_SECRET_KEY       optional; stored on the Worker as a secret so /account can sign people in
#   WEB_GITHUB_TOKEN       optional; a token with no permissions, stored on the Worker as GITHUB_TOKEN
#                          so the release manifest reads GitHub at 5,000 requests an hour instead of
#                          the 60 shared by every unauthenticated Worker
# Repository variables: MURMUR_SITE_URL (the public origin once known, for absolute URLs in
# metadata and the sitemap) and, gated by MURMUR_CLOUD_RELEASE=true like the apps, CONVEX_URL and
# CLERK_PUBLISHABLE_KEY, which the build inlines as NEXT_PUBLIC_* values for the account page.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/backend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# One deploy at a time, in order; a queued deploy is never cancelled, so main always ends up live.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  MURMUR_UPDATE_REPO: ${{ github.repository }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.MURMUR_SITE_URL }}
  NEXT_PUBLIC_CONVEX_URL: ${{ vars.MURMUR_CLOUD_RELEASE == 'true' && vars.CONVEX_URL || '' }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.MURMUR_CLOUD_RELEASE == 'true' && vars.CLERK_PUBLISHABLE_KEY || '' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    name: Build with OpenNext and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see the comment at the top of this workflow)."
            exit 1
          fi
      # The site imports the backend's generated types.
      - run: npm ci
        working-directory: packages/backend
      - run: npm ci
      # `next build` prerenders every page and the release endpoints against the live GitHub
      # Releases API (the workflow token lifts the anonymous limit); OpenNext then turns the output
      # into the Worker in .open-next.
      - name: Build the Worker
        run: npm run build:worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The KV namespace binding in wrangler.jsonc has no id: the first deploy provisions
      # murmur-web-next-inc-cache-kv and later deploys keep using the namespace bound to the Worker.
      - name: Deploy
        run: npx wrangler deploy --config wrangler.jsonc
      # Copies the build's prerendered pages and release manifest into KV, so the first visitors after
      # a deploy are served from the cache instead of waiting for a render. It resolves the namespace
      # from the deployed Worker, which is why it runs after the deploy.
      - name: Populate the incremental cache
        run: npx opennextjs-cloudflare populateCache remote
      # Worker secrets persist across deploys; these two are (re)applied whenever they are set here, so
      # rotating one is a matter of updating the repository secret and pushing.
      - name: Set the Worker secrets
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          WEB_GITHUB_TOKEN: ${{ secrets.WEB_GITHUB_TOKEN }}
        run: |
          if [ -n "$CLERK_SECRET_KEY" ]; then
            printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config wrangler.jsonc
          fi
          if [ -n "$WEB_GITHUB_TOKEN" ]; then
            printf '%s' "$WEB_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config wrangler.jsonc
          fi
