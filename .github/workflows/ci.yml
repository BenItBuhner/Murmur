name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop-check:
    name: Desktop typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  desktop-build:
    name: Desktop build ${{ matrix.os }}
    needs: desktop-check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: murmur-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # v5 is the last MIT-licensed major; v6 moves caching into a proprietary
      # component that requires accepting Gradle's Terms of Use.
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: murmur-android
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
