name: Restore lockfile only

on:
  push:
    branches: [main]
    paths: ['.github/restore/SPLIT-B']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate lockfile and commit
        id: lock
        continue-on-error: true
        run: |
          set -euxo pipefail
          exec > /tmp/lock.log 2>&1
          git config user.name 'Bennett Buhner'
          git config user.email '136861830+BenItBuhner@users.noreply.github.com'
          cd apps/desktop
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error
          cd ../..
          git add apps/desktop/package-lock.json
          git rm -qf .github/restore/SPLIT-B
          git commit -m 'Regenerate desktop package-lock.json'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      - name: Commit failure log
        if: steps.lock.outcome == 'failure'
        run: |
          git reset --hard HEAD
          git clean -fd
          mkdir -p .github/restore
          cp /tmp/lock.log .github/restore/lock-fail.log 2>/dev/null || echo 'log missing' > .github/restore/lock-fail.log
          git config user.name 'Bennett Buhner'
          git config user.email '136861830+BenItBuhner@users.noreply.github.com'
          git add .github/restore/lock-fail.log
          git commit -m 'Lockfile restore failed; see lock-fail.log'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done
          exit 1
