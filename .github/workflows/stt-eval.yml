name: Transcription eval

# The transcription eval (apps/inference-worker/eval/run.ts) through the Worker's own handlers
# against the production speech and formatting providers, with the Worker's provider keys. Never
# on pull requests or main: run it by hand (workflow_dispatch) or push to a branch named eval/**.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per clip per arm
        default: '5'
      arms:
        description: Comma-separated arm prefixes (empty = all)
        default: ''
      script:
        description: Eval script (run = clips, pieces = streamed long dictations)
        default: 'run'
  push:
    branches: ['eval/**']
    paths: ['apps/inference-worker/eval/**', 'packages/backend/convex/lib/**', 'packages/text-engine/src/**', 'apps/inference-worker/wrangler.jsonc', '.github/workflows/stt-eval.yml']

concurrency:
  group: stt-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        with:
          path: /tmp/stt-eval
          key: stt-eval-audio-${{ hashFiles('apps/inference-worker/eval/prepare-audio.sh') }}
      - run: test -f /tmp/stt-eval/manifest.json || bash apps/inference-worker/eval/prepare-audio.sh /tmp/stt-eval
      - run: rm -rf /tmp/stt-eval/raw
      - run: npm ci --ignore-scripts
        working-directory: packages/backend
      - run: npm ci
        working-directory: apps/inference-worker
      - name: Eval
        working-directory: apps/inference-worker
        env:
          MURMUR_INFERENCE_STT_KEY: ${{ secrets.MURMUR_INFERENCE_STT_KEY }}
          MURMUR_INFERENCE_LLM_KEY: ${{ secrets.MURMUR_INFERENCE_LLM_KEY }}
          STT_EVAL_ARMS: ${{ inputs.arms }}
        run: npx -y tsx@4.19.2 eval/${{ inputs.script || 'run' }}.ts /tmp/stt-eval ${{ inputs.runs || '5' }} ${{ github.sha }} 2>&1 | grep -v '^\[gateway\]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stt-eval-${{ github.sha }}
          path: /tmp/stt-eval/re*-*
