# One-off: shows on an emulator how Murmur learns dictionary words from the user's corrections.
# Builds this branch, runs .github/dictionary-demo/run.sh, and pushes screenshots, a screen
# recording and the step log to the dictionary-demo-results branch.
name: Dictionary demo
on:
  push:
    branches: [claude/dictionary-demo]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: apps/android
        run: ./gradlew :app:assembleDirectDebug
      - name: Start the stand-in speech model
        run: nohup python3 .github/dictionary-demo/stt_mock.py > stt.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: OUT=demo bash .github/dictionary-demo/run.sh apps/android/app/build/outputs/apk/direct/debug/app-direct-debug.apk
      - name: Publish results
        if: always()
        run: |
          mkdir -p demo && cp stt.log demo/ 2>/dev/null || true
          cd demo
          git init -q -b dictionary-demo-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Dictionary demo for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dictionary-demo-results
