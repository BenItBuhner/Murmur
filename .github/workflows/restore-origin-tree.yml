name: Restore Origin tree

on:
  push:
    branches: [main]
    paths: ['.github/restore/**']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: restore-origin-tree
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore assets and prune stale files
        shell: bash
        run: |
          LOG=/tmp/restore.log
          cat > /tmp/restore.sh << 'EOS'
          if [ ! -f .github/restore/GO ]; then
            echo 'Payload incomplete; waiting for GO marker.'
            exit 0
          fi
          cat .github/restore/home-part-* | tr -d '\n' | base64 -d > docs/home.png
          echo 'a900f6fac5f36e92c0666bd24458c791526cb56984b1cd850b5de973837a50e0  docs/home.png' | sha256sum -c -
          curl -fsSL -o /tmp/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          echo '59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  /tmp/jfk.wav' | sha256sum -c -
          mkdir -p apps/desktop/resources/fixtures apps/android/app/src/main/assets/fixtures
          cp /tmp/jfk.wav apps/desktop/resources/fixtures/jfk.wav
          cp /tmp/jfk.wav apps/android/app/src/main/assets/fixtures/jfk.wav
          curl -fsSL -o /tmp/gw.jar https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  /tmp/gw.jar' | sha256sum -c -
          mkdir -p apps/android/gradle/wrapper
          cp /tmp/gw.jar apps/android/gradle/wrapper/gradle-wrapper.jar
          (cd apps/desktop && node scripts/gen-icons.mjs)
          (cd apps/desktop && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          chmod +x apps/android/gradlew
          sort .github/restore/keep-list.txt > /tmp/keep.txt
          git add -A
          git ls-files | sort > /tmp/have.txt
          comm -23 /tmp/have.txt /tmp/keep.txt > /tmp/stale.txt
          echo "Pruning $(wc -l < /tmp/stale.txt) stale paths"
          while IFS= read -r f; do git rm -qf -- "$f"; done < /tmp/stale.txt
          git add -A
          EOS
          git config user.name 'Bennett Buhner'
          git config user.email '136861830+BenItBuhner@users.noreply.github.com'
          if bash -euo pipefail /tmp/restore.sh > "$LOG" 2>&1; then
            cat "$LOG"
            if git diff --cached --quiet; then
              echo 'Nothing to commit.'
              exit 0
            fi
            git commit -m 'Restore binaries and lockfile from verified sources; prune stale pre-monorepo files'
            git push origin HEAD:main
            echo 'Restore complete.'
          else
            RC=$?
            echo "RESTORE FAILED rc=$RC" >> "$LOG"
            cat "$LOG"
            git reset --hard HEAD
            mkdir -p .github/restore
            cp "$LOG" .github/restore/last-run.log
            git add .github/restore/last-run.log
            git commit -m 'Restore run failed; see .github/restore/last-run.log'
            git push origin HEAD:main
            exit "$RC"
          fi
