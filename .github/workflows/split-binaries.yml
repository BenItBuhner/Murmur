name: Restore binaries only

on:
  push:
    branches: [main]
    paths: ['.github/restore/SPLIT-A']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore binaries and commit
        id: bin
        continue-on-error: true
        run: |
          set -euxo pipefail
          exec > /tmp/bin.log 2>&1
          git config user.name 'Bennett Buhner'
          git config user.email '136861830+BenItBuhner@users.noreply.github.com'
          cat .github/restore/home-part-* | tr -d '\n' | base64 -d > docs/home.png
          echo 'a900f6fac5f36e92c0666bd24458c791526cb56984b1cd850b5de973837a50e0  docs/home.png' | sha256sum -c -
          curl -fsSL --max-time 120 -o /tmp/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          echo '59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e  /tmp/jfk.wav' | sha256sum -c -
          mkdir -p apps/desktop/resources/fixtures apps/android/app/src/main/assets/fixtures
          cp /tmp/jfk.wav apps/desktop/resources/fixtures/jfk.wav
          cp /tmp/jfk.wav apps/android/app/src/main/assets/fixtures/jfk.wav
          curl -fsSL --max-time 120 -o /tmp/gw.jar https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  /tmp/gw.jar' | sha256sum -c -
          mkdir -p apps/android/gradle/wrapper
          cp /tmp/gw.jar apps/android/gradle/wrapper/gradle-wrapper.jar
          cd apps/desktop && node scripts/gen-icons.mjs && cd ../..
          chmod +x apps/android/gradlew
          git add docs/home.png apps/desktop/resources apps/android/app/src/main/assets/fixtures apps/android/gradle/wrapper/gradle-wrapper.jar apps/desktop/build/icon.png apps/android/gradlew
          git rm -qf .github/restore/SPLIT-A
          git commit -m 'Restore binary assets from verified sources'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      - name: Commit failure log
        if: steps.bin.outcome == 'failure'
        run: |
          git reset --hard HEAD
          git clean -fd
          mkdir -p .github/restore
          cp /tmp/bin.log .github/restore/bin-fail.log 2>/dev/null || echo 'log missing' > .github/restore/bin-fail.log
          git config user.name 'Bennett Buhner'
          git config user.email '136861830+BenItBuhner@users.noreply.github.com'
          git add .github/restore/bin-fail.log
          git commit -m 'Binary restore failed; see bin-fail.log'
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done
          exit 1
